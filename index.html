<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Créateur de logo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
<h1>Créateur de logo</h1>
<p>Couleurs, drapeaux LGBT, textes et formes : réglez chaque détail, puis exportez en PNG, JPG, WEBP ou SVG.</p>
</header>
<main class="app">
<section class="stage">
<div class="stagecard">
<div id="prev"></div>
<div class="bar"><button class="btn primary" id="dpng">Télécharger l’image</button><button class="btn" id="dsvg">SVG</button><button class="btn" id="dcp">Copier le SVG</button></div>
<div id="msg"></div>
</div>
</section>
<aside class="panel">
<div id="ctl"></div>
<input type="file" id="file" accept="image/*" hidden>
</aside>
</main>
<footer class="credit">L’intelligence artificielle n’a eu qu’une toute petite part dans ce projet : elle a seulement aidé à corriger ce site.</footer>
<script src="script.js">
</script>
</body>
</html>
